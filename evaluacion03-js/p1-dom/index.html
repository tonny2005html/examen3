<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CaféTec - Gestor de Pedidos</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
    .error { color: red; font-weight: bold; }
    ul { list-style: none; padding: 0; }
    li { margin: 8px 0; padding: 8px; border: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
    .entregado { text-decoration: line-through; opacity: 0.6; background-color: #f0f0f0; }
    button { cursor: pointer; margin-left: 5px; }
  </style>
</head>
<body>
  <h1>CaféTec - Pedidos</h1>
  
  <form id="form-pedido">
    <input id="producto" placeholder="Producto">
    <input id="precio" type="number" step="0.10" placeholder="Precio S/">
    <input id="cantidad" type="number" min="0" placeholder="Cantidad">
    <button type="submit">Agregar</button>
  </form>
  
  <p id="mensaje" class="error"></p>
  
  <select id="filtro">
    <option value="todos">Todos</option>
    <option value="pendiente">Pendientes</option>
    <option value="entregado">Entregados</option>
  </select>

  <ul id="lista-pedidos"></ul>
  <h3 id="total">Total General: S/ 0.00</h3>

  <script src="app.js"></script>
</body>
</html>
